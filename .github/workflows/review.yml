name: Review

# AI code review of pull requests with OpenCodeReview
# (https://github.com/alibaba/open-code-review). A pull request is reviewed
# when it is opened, marked ready for review, reopened, or pushed to, and a
# maintainer can re-run the review by commenting `/open-code-review` on it.
# Setup, and the secrets and variables this needs, are documented in
# docs/review.md.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

# A new review cancels a stale one for the same pull request. Comments that do
# not ask for a review get a unique group, so they are skipped without
# cancelling a review in progress.
concurrency:
  group: ${{ (github.event_name == 'pull_request_target' || startsWith(github.event.comment.body, '/open-code-review')) && format('review-{0}', github.event.pull_request.number || github.event.issue.number) || format('review-noop-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false)
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
        && startsWith(github.event.comment.body, '/open-code-review')
      )
    steps:
      # An issue_comment event carries no pull request refs; resolve them so the
      # action reviews the right range.
      - id: pr
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefName,headRefOid \
            --jq '"base_ref=\(.baseRefName)", "head_sha=\(.headRefOid)"' >> "$GITHUB_OUTPUT"

      # The action checks out the trusted base branch itself and reviews the
      # base-to-head diff from git objects; it never runs code from the pull
      # request, which is what makes pull_request_target safe here.
      - uses: alibaba/open-code-review@bccbc15f785269400735d5255540c231e6c02b6d # ratchet:alibaba/open-code-review@v1.12.9
        with:
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_use_anthropic: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
          # Keep the CLI on the same release as the pinned action.
          ocr_version: 1.12.9
          base_ref: ${{ steps.pr.outputs.base_ref }}
          head_sha: ${{ steps.pr.outputs.head_sha }}
          # One summary comment updated in place; a push reviews only the new
          # commits and never repeats an inline comment already on the thread.
          sticky_summary: 'true'
          incremental: 'true'
          checkpoint_range: 'true'
